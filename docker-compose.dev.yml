version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meucarro
      POSTGRES_USER: meucarro
      POSTGRES_PASSWORD: meucarro123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meucarro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
